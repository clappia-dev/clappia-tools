name: Publish to PyPI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install pre-commit
        run: |
          uv pip install --system pre-commit

      - name: Configure git for pre-commit
        run: |
          git config --global --add safe.directory '*'
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "git@github.com:"

      - name: Set up pre-commit hooks
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          pre-commit install-hooks

      - name: Run pre-commit checks
        run: |
          pre-commit run --all-files

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
